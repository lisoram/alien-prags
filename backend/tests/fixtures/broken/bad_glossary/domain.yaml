name: bad_glossary
display_name: Sample
enabled: false
sources:
  - type: pdf_folder
    path: some/path
chunking: {strategy: fixed, max_tokens: 400, overlap_tokens: 40, keep_tables_whole: false}
retrieval: {top_k: 5, candidate_k: 20, hybrid: true, keyword_weight: 0.3, rerank: false}
access: {allowed_roles: [researcher, admin], default_doc_label: public}
generation: {disclaimer: "Sample disclaimer.", require_citations: true, refuse_topics: [x]}
eval: {min_recall_at_5: 0.8, min_faithfulness: 0.9, min_citation_precision: 0.9, custom_checks: [includes_disclaimer]}
